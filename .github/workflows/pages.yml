name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write        # allowed to publish to GitHub Pages
  id-token: write     # proves to Pages that this run comes from this repo (OIDC)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          for f in index.html chatbot.js assets/resume.pdf; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
      - name: No TODO left in data.js
        run: |
          if grep -n TODO data.js; then echo "Remove the TODOs above"; exit 1; fi

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
